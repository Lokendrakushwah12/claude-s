<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>explainer lesson</title>
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  canvas { display: block; margin: auto; }
  #hud { position: fixed; left: 8px; bottom: 8px; font: 12px ui-monospace, monospace; color: #fff; background: #0008; padding: 4px 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<!-- voices.js is written by narrate.mjs; until then the browser's voice reads the captions in preview -->
<script src="voices/voices.js"></script>
<!-- iso.js (kit's lift()) is copied in by the setup line; a lesson that doesn't lift never calls it -->
<script src="iso.js"></script>
<script src="engine.js"></script>
<script src="kit.js"></script>
<script src="audio.js"></script>
<script src="lesson.js"></script>
<script>
// The page is the player.
// Preview: open it in Chrome. Click or space plays with sound and narration, arrows seek 5 s, d flips the theme,
//   c toggles captions, #42 in the URL starts at 42 s, ?look=riso&theme=dark tries another look.
// Render: render.mjs loads ?render and calls seek(t) per frame after `ready`; mixdown()/wavChunk() hand it the WAV.
(() => { // scoped, so the lesson file can use any top-level names
const q = new URLSearchParams(location.search);
const [PW, PH] = (q.get('size') || '1920x1080').split('x').map(Number); // 16:9 only: the lesson is 960x540 units
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), hud = document.getElementById('hud');
cv.width = PW; cv.height = PH; cv.style.width = `min(100vw, ${(PW / PH) * 100}vh)`;
const view = { dark: q.has('theme') ? q.get('theme') === 'dark' : undefined, look: q.get('look') || undefined, captions: q.get('captions') !== '0' };

function paint(t) {
  ctx.setTransform(PW / W, 0, 0, PW / W, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  LESSON.draw(ctx, t, view); // the caption too, in the look's style (typed, for voice: 'typed')
}

// Fonts: the look's Google fonts. Ask for the weights by name (a bare family serves only 400, and 500/700 come out
// faked), and load each before the first frame, or frame 0 renders in a fallback
const look = LOOKS[view.look] ?? LOOKS[LESSON.look];
const families = [...new Set(Object.values(look.fonts))];
for (const k in look.fonts) fonts[k] = `"${look.fonts[k]}", ${k === 'mono' ? 'ui-monospace, monospace' : 'system-ui, sans-serif'}`;
window.ready = new Promise((res) => {
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.onload = l.onerror = res;
  l.href = `https://fonts.googleapis.com/css2?${families.map((f) => `family=${f.replace(/ /g, '+')}:wght@400;500;700`).join('&')}&display=block`;
  document.head.appendChild(l);
}).then(() => Promise.all(families.flatMap((f) => [400, 500, 700].map((w) => document.fonts.load(`${w} 40px "${f}"`)))))
  .then(() => document.fonts.ready);

if (q.has('render')) {
  hud.remove();
  window.VIDEO = { duration: LESSON.duration, audio: 'audio.wav' };
  window.seek = paint;
  // fetch() refuses file:// URLs; XHR works, because render.mjs starts Chrome with --allow-file-access-from-files
  const load = (url) => new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('GET', url);
    x.responseType = 'arraybuffer';
    x.onload = () => res(x.response);
    x.onerror = () => rej(new Error(`cannot read ${url}`));
    x.send();
  });
  let wav;
  window.mixdown = async () => (wav = await soundtrack(LESSON, load)).length;
  window.wavChunk = (i, n) => new Promise((res) => {
    const f = new FileReader();
    f.onload = () => res(f.result.slice(f.result.indexOf(',') + 1));
    f.readAsDataURL(new Blob([wav.subarray(i, i + n)]));
  });
} else {
  // ---- preview: the audio clock drives the picture; sounds are booked ~150 ms ahead (web.dev "A Tale of Two Clocks") ----
  const EVENTS = lessonEvents(LESSON), LEVEL = LESSON.music ? musicLevel(LESSON) : null;
  const P = { t: parseFloat(location.hash.slice(1)) || LESSON.poster, playing: false, ac: null, out: null, session: null, nodes: [], timer: 0, anchor: { clock: 0, t: 0 }, next: 0 };
  const clock = () => (P.ac ? P.ac.currentTime : performance.now() / 1000);
  const now = () => (P.playing ? Math.min(P.anchor.t + clock() - P.anchor.clock, LESSON.duration) : P.t);

  function startAudio() {
    const ac = P.ac, session = ac.createGain(), music = ac.createGain();
    session.connect(P.out);
    music.connect(session);
    P.session = session;
    P.anchor = { clock: clock(), t: P.t };
    const bus = { ctx: ac, out: session }, mbus = { ctx: ac, out: music }, t0 = P.t, on = (e) => (e.bus === 'music' ? mbus : bus);
    // The music's level (ducked under the voice, up in the breaths, silent in gaps) from here on
    if (LEVEL) { const i0 = Math.floor(t0 / LEVEL.step), rest = LEVEL.g.slice(i0); if (rest.length > 1) music.gain.setValueCurveAtTime(rest, ac.currentTime, LEVEL.step * (rest.length - 1)); }
    // Held pad chords already under way at the seek point resume for what is left of them
    for (const e of EVENTS) if (e.len > 0 && e.at < t0 && e.at + e.len > t0 + 0.3) P.nodes.push(...e.play(on(e), ac.currentTime + 0.01, e.at + e.len - t0));
    P.next = EVENTS.findIndex((e) => e.at >= t0);
    if (P.next < 0) P.next = EVENTS.length;
    const schedule = () => {
      const horizon = now() + 0.15;
      while (P.next < EVENTS.length && EVENTS[P.next].at < horizon) {
        const e = EVENTS[P.next++];
        P.nodes.push(...e.play(on(e), Math.max(ac.currentTime, P.anchor.clock + e.at - P.anchor.t), e.len));
      }
      if (P.nodes.length > 400) P.nodes = P.nodes.slice(-200);
    };
    schedule();
    P.timer = setInterval(schedule, 25);
  }
  function stopAudio() {
    clearInterval(P.timer);
    const s = P.session;
    if (!s) return;
    s.gain.setTargetAtTime(0, P.ac.currentTime, 0.015);
    for (const n of P.nodes) try { n.stop(P.ac.currentTime + 0.08); } catch {}
    P.nodes = [];
    P.session = null;
    setTimeout(() => s.disconnect(), 200);
  }

  // The narrator: each caption is spoken the moment it appears, from its recorded clip or else the browser's voice.
  // If the voice is still talking when the next caption is due, the film waits for it (holdAt).
  const voice = {
    idx: -1, busy: null, el: new Audio(), synth: window.speechSynthesis, best: null,
    reset() { this.idx = -1; this.busy = null; this.synth?.cancel(); this.el.pause(); },
    holdAt() {
      const b = this.busy;
      if (!b) return null;
      if (performance.now() > b.until) return (this.busy = null);
      return LESSON.captions[b.i + 1]?.at ?? null;
    },
    sync(t) {
      const i = activeIndex(LESSON.captions, t);
      if (i === this.idx) return;
      this.idx = i;
      const c = LESSON.captions[i], off = t - (c?.at ?? 0);
      this.synth?.cancel();
      this.el.pause();
      this.busy = null;
      if (!c?.text || LESSON.voice === 'typed') return;
      if (c.clip) {
        if (off > c.clip.seconds - 0.15) return;
        const url = new URL(c.clip.url, location.href).href;
        if (this.el.src !== url) this.el.src = url;
        this.el.currentTime = off;
        const mine = (this.busy = { i, until: performance.now() + (c.clip.seconds - off) * 1500 + 2000 });
        this.el.onended = () => { if (this.busy === mine) this.busy = null; };
        this.el.play().catch(() => {});
        return;
      }
      if (!this.synth) return;
      // Joined part-way through (a seek): skip the words the film has already passed
      const words = speakable(c.say ?? c.text, LESSON.pronounce).split(' ');
      const done = clamp(off / ((LESSON.captions[i + 1]?.at ?? LESSON.duration) - c.at)), skip = Math.floor(words.length * done);
      if (skip >= words.length - 1) return;
      const u = new SpeechSynthesisUtterance(words.slice(skip).join(' '));
      if (this.best) u.voice = this.best;
      u.lang = this.best?.lang ?? 'en-GB';
      const mine = (this.busy = { i, until: performance.now() + speechSeconds(c.say ?? c.text, LESSON.pronounce) * (1 - done) * 2000 + 1500 });
      u.onend = u.onerror = () => { if (this.busy === mine) this.busy = null; };
      this.synth.speak(u);
    },
  };
  const pickVoice = () => {
    const rank = (v) => (/natural|neural|premium|enhanced/i.test(v.name) ? 8 : 0) + (/google/i.test(v.name) ? 4 : 0) + (v.localService ? 0 : 1);
    voice.best = voice.synth?.getVoices().filter((v) => /^en/i.test(v.lang)).sort((a, b) => rank(b) - rank(a))[0] ?? null;
  };
  voice.synth?.addEventListener('voiceschanged', pickVoice);
  pickVoice();

  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function show(t) {
    paint(t);
    const c = LESSON.chapters[activeIndex(LESSON.chapters, t)];
    hud.textContent = `${fmt(t)} / ${fmt(LESSON.duration)} · ${c?.title ?? ''}${P.playing ? '' : ' · click or space to play, ←/→ seek, d theme, c captions'}`;
  }
  function loop() {
    if (!P.playing) return;
    let t = now();
    const hold = voice.holdAt();
    if (hold !== null && t > hold - 0.02) {
      t = Math.max(0, hold - 0.02);
      P.anchor = { clock: clock(), t }; // the sound scheduler reads the same anchor, so it waits too
    }
    show(t);
    voice.sync(t);
    if (t >= LESSON.duration) { P.t = LESSON.duration; P.playing = false; stopAudio(); return; }
    requestAnimationFrame(loop);
  }
  async function toggle() {
    if (P.playing) { P.t = now(); P.playing = false; stopAudio(); voice.reset(); return show(P.t); }
    if (!P.ac) {
      P.ac = new AudioContext();
      P.out = P.ac.createDynamicsCompressor();
      P.out.threshold.value = -14;
      P.out.connect(P.ac.destination);
    }
    await P.ac.resume();
    if (P.t >= LESSON.duration - 0.05) P.t = 0;
    P.playing = true;
    startAudio();
    loop();
  }
  function seekTo(t) {
    P.t = clamp(t, 0, LESSON.duration);
    voice.reset();
    if (P.playing) { stopAudio(); startAudio(); } else show(P.t);
  }
  addEventListener('click', toggle);
  addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight') seekTo(now() + 5);
    if (e.key === 'ArrowLeft') seekTo(now() - 5);
    if (e.key === 'd') view.dark = !(view.dark ?? LESSON.theme === 'dark');
    if (e.key === 'c') view.captions = !view.captions;
    if (!P.playing) show(P.t);
  });
  window.ready.then(() => show(P.t));
}
})();
</script>
</body>
</html>
